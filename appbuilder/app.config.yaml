application:
  actions: actions
  runtimeManifest:
    packages:
      salesforce-entity-bridge:
        license: Apache-2.0
        actions:
          entities:
            function: actions/entities/index.js
            web: 'yes'
            runtime: nodejs:18
            inputs:
              LOG_LEVEL: debug
              SALESFORCE_INSTANCE_URL: $SALESFORCE_INSTANCE_URL
              SALESFORCE_CONSUMER_KEY: $SALESFORCE_CONSUMER_KEY
              SALESFORCE_CONSUMER_SECRET: $SALESFORCE_CONSUMER_SECRET
              SALESFORCE_TOKEN_URL: $SALESFORCE_TOKEN_URL
              SALESFORCE_REFRESH_TOKEN: $SALESFORCE_REFRESH_TOKEN
              SALESFORCE_OAUTH_SCOPE: $SALESFORCE_OAUTH_SCOPE
              SALESFORCE_API_VERSION: $SALESFORCE_API_VERSION
              SALESFORCE_OBJECT_NAME: $SALESFORCE_OBJECT_NAME
              SALESFORCE_AUTHORIZATION_URL: $SALESFORCE_AUTHORIZATION_URL
              SALESFORCE_CALLBACK_URL: $SALESFORCE_CALLBACK_URL
              SALESFORCE_OAUTH_STATE: $SALESFORCE_OAUTH_STATE
            annotations:
              require-adobe-auth: false
              final: true
          describe:
            function: actions/describe/index.js
            web: 'yes'
            runtime: nodejs:18
            inputs:
              LOG_LEVEL: debug
              SALESFORCE_INSTANCE_URL: $SALESFORCE_INSTANCE_URL
              SALESFORCE_CONSUMER_KEY: $SALESFORCE_CONSUMER_KEY
              SALESFORCE_CONSUMER_SECRET: $SALESFORCE_CONSUMER_SECRET
              SALESFORCE_TOKEN_URL: $SALESFORCE_TOKEN_URL
              SALESFORCE_REFRESH_TOKEN: $SALESFORCE_REFRESH_TOKEN
              SALESFORCE_OAUTH_SCOPE: $SALESFORCE_OAUTH_SCOPE
              SALESFORCE_API_VERSION: $SALESFORCE_API_VERSION
              SALESFORCE_OBJECT_NAME: $SALESFORCE_OBJECT_NAME
              SALESFORCE_AUTHORIZATION_URL: $SALESFORCE_AUTHORIZATION_URL
              SALESFORCE_CALLBACK_URL: $SALESFORCE_CALLBACK_URL
              SALESFORCE_OAUTH_STATE: $SALESFORCE_OAUTH_STATE
            annotations:
              require-adobe-auth: false
              final: true
          submit:
            function: actions/submit/index.js
            web: 'yes'
            runtime: nodejs:18
            inputs:
              LOG_LEVEL: debug
              SALESFORCE_INSTANCE_URL: $SALESFORCE_INSTANCE_URL
              SALESFORCE_CONSUMER_KEY: $SALESFORCE_CONSUMER_KEY
              SALESFORCE_CONSUMER_SECRET: $SALESFORCE_CONSUMER_SECRET
              SALESFORCE_TOKEN_URL: $SALESFORCE_TOKEN_URL
              SALESFORCE_REFRESH_TOKEN: $SALESFORCE_REFRESH_TOKEN
              SALESFORCE_OAUTH_SCOPE: $SALESFORCE_OAUTH_SCOPE
              SALESFORCE_API_VERSION: $SALESFORCE_API_VERSION
              SALESFORCE_OBJECT_NAME: $SALESFORCE_OBJECT_NAME
              SALESFORCE_AUTHORIZATION_URL: $SALESFORCE_AUTHORIZATION_URL
              SALESFORCE_CALLBACK_URL: $SALESFORCE_CALLBACK_URL
              SALESFORCE_OAUTH_STATE: $SALESFORCE_OAUTH_STATE
            annotations:
              require-adobe-auth: false
              final: true
